<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Game Stash</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1b29, #0f0c1b);
            color: white;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 40px;
        }

        #games-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .game-btn {
            background: #252238;
            border: 1px solid #44405c;
            color: white;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .game-btn:hover {
            background: #5986da;
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

    <h1>🎮 My Game Stash</h1>

    <p class="subtitle">
        Choose a game to play
    </p>

    <div id="games-container"></div>

    <script src="script.js"></script>

</body>
</html>
